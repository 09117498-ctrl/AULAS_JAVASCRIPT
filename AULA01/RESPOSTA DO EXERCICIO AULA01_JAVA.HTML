<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Fixação - Flexbox + JS</title>
    <style>
        /* Estilização Global e Flexbox no Body */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1b1b2f; /* Background escuro */
            color: #e2e2e2;            /* Cor da fonte principal */
            font-family: 'Segoe UI', Arial, sans-serif;
            
            /* Centralização completa com Flexbox */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container no formato de Cartão */
        main.card {
            background-color: #162447;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #1f4068;
        }

        h1 {
            color: #e43f5a;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #1f4068;
            padding-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 12px;
            color: #dcdde1;
        }

        strong {
            color: #f1c40f; /* Destaque em amarelo para os dados inseridos */
        }

        .alerta-cancelado {
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Ficha do Aluno</h1>

        <script>
            // Alerta de início
            window.alert('Bem-vindo ao sistema de cadastro!')

            // Confirmação de abertura
            var continuar = window.confirm('Deseja preencher seus dados agora?')

            if (continuar) {
                // Entrada de dados
                var nome = window.prompt('Digite seu nome completo:')
                var n1 = Number.parseInt(window.prompt('Digite o primeiro número inteiro:'))
                var n2 = Number.parseInt(window.prompt('Digite o segundo número inteiro:'))
                var soma = n1 + n2

                // Impressão dos resultados dentro do cartão
                document.write(`<p>Nome em maiúsculas: <strong>${nome.toUpperCase()}</strong></p>`)
                document.write(`<p>Nome em minúsculas: <strong>${nome.toLowerCase()}</strong></p>`)
                document.write(`<p>Total de letras no nome: <strong>${nome.length}</strong></p>`)
                document.write(`<p>Resultado da soma: <strong>${n1} + ${n2} = ${soma}</strong></p>`)
                
                window.alert('Cadastro exibido com sucesso!')
            } else {
                document.write('<p class="alerta-cancelado">Operação cancelada pelo usuário.</p>')
            }
        </script>
    </main>
</body>
</html>
